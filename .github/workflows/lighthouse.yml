name: Lighthouse

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Auditar início e detalhe
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HUSKY: '0'
      VITE_ENABLE_MOCKS: 'true'
    steps:
      - name: Obter o código do run
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configurar Node e cache npm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Fixar npm da aplicação
        run: npm install --global npm@11.6.0
      - name: Instalar pelo lockfile
        run: npm ci
      - name: Instalar Chromium e dependências
        run: npm exec -- playwright install --with-deps chromium
      - name: Construir o aplicativo completo
        run: npm run build
      - name: Auditar doze vezes e conferir as medianas
        run: npm run audit:lighthouse
      - name: Guardar auditorias HTML JSON e medianas
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: lighthouse-${{ github.sha }}-${{ github.run_attempt }}
          path: reports/lighthouse/
          if-no-files-found: error
          retention-days: 14
